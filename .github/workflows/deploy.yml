name: Deploy approved Worker
on:
  workflow_dispatch:
    inputs:
      approved:
        description: 'I approve deploying this backend to Cloudflare'
        required: true
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: production-deploy
  cancel-in-progress: false
jobs:
  deploy:
    if: inputs.approved == true && github.ref == 'refs/heads/main'
    environment: production
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_D1_DATABASE_ID: ${{ vars.CLOUDFLARE_D1_DATABASE_ID }}
      PUBLIC_URL: ${{ vars.PUBLIC_URL }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_USER_ID: ${{ secrets.TELEGRAM_USER_ID }}
      TELEGRAM_WEBHOOK_SECRET: ${{ secrets.TELEGRAM_WEBHOOK_SECRET }}
      STRAVA_WEBHOOK_SECRET: ${{ secrets.STRAVA_WEBHOOK_SECRET }}
      STRAVA_VERIFY_TOKEN: ${{ secrets.STRAVA_VERIFY_TOKEN }}
      STRAVA_CLIENT_ID: ${{ secrets.STRAVA_CLIENT_ID }}
      STRAVA_CLIENT_SECRET: ${{ secrets.STRAVA_CLIENT_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: node scripts/prepare-deploy.mjs
      - run: npx wrangler d1 migrations apply DB --remote --config .deploy-config.json
      - run: npx wrangler deploy --config .deploy-config.json
      - run: npx wrangler secret bulk .deploy-secrets.json --config .deploy-config.json
      - name: Remove temporary deployment files
        if: always()
        run: rm -f .deploy-config.json .deploy-secrets.json
